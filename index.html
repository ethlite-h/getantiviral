    <script>
      (function () {
        var q = new URLSearchParams(location.search).get('v'), v = null;
        if (q === 'a' || q === 'b') { v = q; try { localStorage.setItem('av.variant', v); } catch (e) {} }
        else { try { v = localStorage.getItem('av.variant'); } catch (e) {} }
        // B (product first) is the default; A (story first) stays reachable via ?v=a or the pill
        if (v === 'a') { var h = document.documentElement; h.dataset.variant = 'a'; h.dataset.world = 'feed'; var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', '#0B0A09'); }
