<!DOCTYPE html>
<!-- Capture page for the privacy floor plan, section 10 (scripts/render-gifs.mjs, target "floorplan").
     Mounts the section, keeps only the sheet, and drives GSAP's clock and the CSS keyframes by hand
     so every frame is deterministic. window.__seek(t) renders time t; window.__ready holds the schedule. -->
<html lang="en" data-world="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>floor plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    html, body { margin: 0; background: #F5F2EB; }
    #stage { width: 728px; }
    /* the sheet alone: no head, no key, no body copy, no section padding */
    #stage .section { padding: 0; }
    #stage .container { max-width: none; width: 100%; padding: 0; }
    #stage header.architecture__head, #stage .architecture__grid { display: none; } /* header only: the arrowheads share the class */
    #stage .architecture__sheet { margin: 0; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module">
    import '/src/mockup/styles/base.css'
    import '/src/mockup/styles/sections.css'
    import { gsap } from '/src/mockup/lib/scroll.js'
    import { html } from '/src/mockup/sections/architecture.js'

    // hand-cranked clock: nothing advances unless __seek moves it
    gsap.ticker.remove(gsap.updateRoot)
    gsap.ticker.lagSmoothing(0)

    const stage = document.getElementById('stage')
    stage.innerHTML = html
    await document.fonts.ready
    const svg = stage.querySelector('.architecture__plan--d')

    // ---- the walls draw in, then the labels fade (the same schedule as architecture.js init)
    const draws = Array.from(svg.querySelectorAll('.architecture__draw'))
    const fades = Array.from(svg.querySelectorAll(
      '.architecture__fade, .architecture__num, .architecture__name, .architecture__detail, .architecture__tiny, .architecture__glyph, .architecture__sign, .architecture__here-dot',
    ))
    const lengths = draws.map((p) => {
      const L = p.getTotalLength()
      p.style.strokeDasharray = `${L} ${L}`
      p.style.strokeDashoffset = `${L}`
      return L
    })
    gsap.set(fades, { opacity: 0 })
    const master = gsap.timeline({ defaults: { ease: 'power2.inOut' } })
    draws.forEach((p, i) => {
      master.to(p, { strokeDashoffset: 0, duration: 0.5 + Math.min(lengths[i], 1200) / 1500 }, i * 0.16)
    })
    master.to(fades, { opacity: 1, duration: 0.7, stagger: 0.025, ease: 'power2.out' }, '-=0.5')
    const drawn = master.duration()

    // ---- the arrows: on the site the scroll scrubs these; here the scroll is scripted
    const arrows = Array.from(svg.querySelectorAll('.architecture__arrow')).map((g) => {
      const shaft = g.querySelector('.architecture__shaft')
      const L = shaft.getTotalLength()
      shaft.style.strokeDasharray = `${L} ${L}`
      shaft.style.strokeDashoffset = `${L}`
      const tips = Array.from(g.querySelectorAll('.architecture__head, .architecture__lbl'))
      tips.forEach((t) => { t.style.opacity = '0' })
      return { shaft, L, tips }
    })
    const windows = [[0.02, 0.42], [0.3, 0.72], [0.55, 0.98]]
    const clamp01 = (v) => Math.min(1, Math.max(0, v))
    const scroll = { t: 0 }
    const ARROWS = 3.6, HOLD = 2.6
    master.to(scroll, {
      t: 1, duration: ARROWS, ease: 'none',
      onUpdate: () => {
        arrows.forEach((a, i) => {
          const [s, e] = windows[i]
          const p = clamp01((scroll.t - s) / (e - s))
          a.shaft.style.strokeDashoffset = `${a.L * (1 - p)}`
          const o = clamp01((p - 0.78) / 0.22)
          a.tips.forEach((n) => { n.style.opacity = String(o) })
        })
      },
    }, drawn + 0.2)

    gsap.updateRoot(0)
    window.__seek = (t) => {
      gsap.updateRoot(t)
      // the "you are here" pulse and the FOR LEASE sway are CSS keyframes: same clock
      document.getAnimations().forEach((an) => { try { an.pause(); an.currentTime = t * 1000 } catch (_) {} })
      return t
    }
    window.__ready = { total: drawn + 0.2 + ARROWS + HOLD }
  </script>
</body>
</html>
